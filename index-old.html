
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANA JAWWAL</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#87c72a;font-family:Arial,sans-serif;color:#17452b}
main{max-width:480px;margin:auto;padding:35px 18px;text-align:center}
.logo{direction:ltr;font-size:39px;font-weight:900;letter-spacing:-2px;margin:25px 0 35px}
.logo span:nth-child(1){color:#fff}
.logo span:nth-child(2){color:#1564ad}
.logo span:nth-child(3){color:#f5dd23}
.logo span:nth-child(4){color:#ef4488}
.box{background:white;padding:25px 20px;border-radius:22px;text-align:right;box-shadow:0 10px 30px #305e2430}
h1{text-align:center;font-size:25px}
p{line-height:1.7}
label{display:block;margin:15px 0 6px;font-weight:bold}
input,select{width:100%;padding:13px;border:1px solid #ccd6cc;border-radius:10px;font-size:16px;background:white}
button{width:100%;padding:15px;margin:9px 0;border:0;border-radius:12px;font-size:16px;font-weight:bold;background:white;color:#17613b;cursor:pointer}
.primary{background:#1466b5;color:white}
.back{background:transparent;color:white}
.hide{display:none}
.note{font-size:13px;color:#666}
.status{background:#fff3ce;padding:16px;border-radius:12px;text-align:center;margin-top:20px}
.error{color:#b42318;font-size:14px}
.success{color:#17613b}
button:disabled{opacity:.6}
</style>
</head>
<body>
<main>
<div class="logo">
<span>ANA</span> <span>JAW</span><span>W</span><span>AL</span>
</div>

<section id="home">
<h1>أهلاً بكم في ANA JAWWAL</h1>
<p>مساحة للإبداع والتعلّم وصناعة الفرص</p>
<button onclick="show('register')">تسجيل طالب جديد</button>
<button onclick="show('login')">تسجيل الدخول</button>
</section>

<section id="register" class="hide">
<div class="box">
<h1>انضم إلى ANA JAWWAL</h1>
<form id="registerForm">
<label>الاسم الرباعي *</label>
<input name="fullName" required minlength="8">

<label>رقم الجوال *</label>
<input name="phone" type="tel" required pattern="05[0-9]{8}" placeholder="05XXXXXXXX">

<label>رقم الهوية *</label>
<input name="nationalId" required inputmode="numeric" pattern="[0-9]{9}" placeholder="9 أرقام">

<label>الجامعة *</label>
<select name="university" required>
<option value="">اختر الجامعة</option>
<option>جامعة بيرزيت</option>
<option>جامعة النجاح الوطنية</option>
<option>جامعة القدس</option>
<option>جامعة الخليل</option>
<option>جامعة بوليتكنك فلسطين</option>
<option>الجامعة العربية الأمريكية - جنين</option>
<option>الجامعة العربية الأمريكية - رام الله</option>
<option>جامعة بيت لحم</option>
<option>جامعة فلسطين الأهلية</option>
<option>جامعة فلسطين التقنية - خضوري</option>
<option>جامعة القدس المفتوحة</option>
<option>الكلية العصرية الجامعية</option>
<option>جامعة أخرى</option>
</select>

<label>الصورة الشخصية *</label>
<input name="photo" type="file" accept="image/*" required>

<label>البريد الإلكتروني *</label>
<input name="email" type="email" autocomplete="email" required>

<label>كلمة المرور *</label>
<input name="password" type="password" autocomplete="new-password" minlength="8" required>

<button id="registerBtn" class="primary" type="submit">إرسال طلب التسجيل</button>
<p id="registerMessage" class="error"></p>
</form>
</div>
<button class="back" onclick="show('home')">رجوع</button>
</section>

<section id="login" class="hide">
<div class="box">
<h1>تسجيل الدخول</h1>
<form id="loginForm">
<label>البريد الإلكتروني</label>
<input name="email" type="email" required autocomplete="email">
<label>كلمة المرور</label>
<input name="password" type="password" required autocomplete="current-password">
<button id="loginBtn" class="primary" type="submit">دخول</button>
<p id="loginMessage" class="error"></p>
</form>
</div>
<button class="back" onclick="show('home')">رجوع</button>
</section>

<section id="done" class="hide">
<div class="box" style="text-align:center">
<h1>أهلاً بك في ANA JAWWAL!</h1>
<p>تم استلام طلبك، وهو بانتظار موافقة مسؤول البرنامج.</p>
<div class="status">حالة الطلب: Pending - بانتظار الموافقة</div>
</div>
<button class="back" onclick="show('home')">الرئيسية</button>
</section>

<section id="dashboard" class="hide">
<div class="box">
<h1>لوحة الطالب</h1>
<p id="welcome"></p>
<p>تم تفعيل عضويتك في برنامج ANA JAWWAL.</p>
<button id="logoutBtn" class="primary">تسجيل الخروج</button>
</div>
</section>
</main>

<script>
function show(id){
document.querySelectorAll("main section").forEach(s=>s.classList.add("hide"));
document.getElementById(id).classList.remove("hide");
}
</script>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {
getAuth,createUserWithEmailAndPassword,
signInWithEmailAndPassword,signOut
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {
getFirestore,doc,setDoc,getDoc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
import {
getStorage,ref,uploadBytes,getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-storage.js";

const firebaseConfig={
apiKey:"AIzaSyCmQWidQXaAm7CbdBUy4heOVREfD0p1oNU",
authDomain:"anajawwal.firebaseapp.com",
projectId:"anajawwal",
storageBucket:"anajawwal.firebasestorage.app",
messagingSenderId:"226105383417",
appId:"1:226105383417:web:9d13f7a2c4b5b4a1744528",
measurementId:"G-ZQXEW378W1"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const storage=getStorage(app);

const registerForm=document.getElementById("registerForm");
const loginForm=document.getElementById("loginForm");

function message(id,text){
document.getElementById(id).textContent=text;
}

function friendlyError(error){
const code=error.code||"";
if(code==="auth/email-already-in-use")return "البريد الإلكتروني مسجل مسبقاً.";
if(code==="auth/invalid-email")return "البريد الإلكتروني غير صحيح.";
if(code==="auth/weak-password")return "كلمة المرور ضعيفة.";
if(code==="auth/invalid-credential")return "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
if(code==="permission-denied"||code==="storage/unauthorized")return "صلاحيات Firebase لا تسمح بإتمام العملية. يجب ضبط قواعد الحماية.";
return "تعذرت العملية: "+(error.message||"خطأ غير معروف");
}

registerForm.addEventListener("submit",async e=>{
e.preventDefault();
const btn=document.getElementById("registerBtn");
btn.disabled=true;
message("registerMessage","جاري إرسال الطلب...");
const data=new FormData(registerForm);
const email=String(data.get("email")).trim();
const password=String(data.get("password"));
const photo=data.get("photo");

try{
if(!photo||!photo.size||!photo.type.startsWith("image/")){
throw new Error("يرجى اختيار صورة شخصية صحيحة.");
}
if(photo.size>5*1024*1024){
throw new Error("حجم الصورة يجب ألا يتجاوز 5 ميغابايت.");
}

const credential=await createUserWithEmailAndPassword(auth,email,password);
const uid=credential.user.uid;
const extension=photo.type==="image/png"?"png":photo.type==="image/webp"?"webp":"jpg";
const photoRef=ref(storage,"student-photos/"+uid+"/profile."+extension);
await uploadBytes(photoRef,photo,{contentType:photo.type});
const photoURL=await getDownloadURL(photoRef);

await setDoc(doc(db,"students",uid),{
fullName:String(data.get("fullName")).trim(),
phone:String(data.get("phone")).trim(),
nationalId:String(data.get("nationalId")).trim(),
university:String(data.get("university")),
email,
photoURL,
status:"pending",
createdAt:serverTimestamp()
});

await signOut(auth);
registerForm.reset();
message("registerMessage","");
show("done");
}catch(error){
message("registerMessage",friendlyError(error));
}finally{
btn.disabled=false;
}
});

loginForm.addEventListener("submit",async e=>{
e.preventDefault();
const btn=document.getElementById("loginBtn");
btn.disabled=true;
message("loginMessage","");
const data=new FormData(loginForm);
try{
const credential=await signInWithEmailAndPassword(
auth,
String(data.get("email")).trim(),
String(data.get("password"))
);
const snapshot=await getDoc(doc(db,"students",credential.user.uid));
if(!snapshot.exists()){
await signOut(auth);
throw new Error("لا يوجد طلب طالب مرتبط بهذا الحساب.");
}
const student=snapshot.data();
if(student.status!=="approved"){
await signOut(auth);
message("loginMessage",student.status==="pending"?
"طلبك بانتظار موافقة مسؤول البرنامج.":
"حسابك غير مفعّل. يرجى التواصل مع مسؤول البرنامج.");
return;
}
document.getElementById("welcome").textContent="أهلاً "+student.fullName;
loginForm.reset();
show("dashboard");
}catch(error){
message("loginMessage",friendlyError(error));
}finally{
btn.disabled=false;
}
});

document.getElementById("logoutBtn").addEventListener("click",async()=>{
await signOut(auth);
show("home");
});
</script>
</body>
</html>

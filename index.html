<section id="register" class="hide"><div class="box"><h1>انضم إلى ANA JAWWAL</h1><form id="registerForm">
<label>الاسم الرباعي *</label><input name="fullName" required minlength="8" autocomplete="name">
<label>رقم الجوال *</label><input name="phone" type="tel" required pattern="05[0-9]{8}" placeholder="05XXXXXXXX">
<label>رقم الهوية *</label><input name="nationalId" required inputmode="numeric" pattern="[0-9]{9}" placeholder="9 أرقام">
<label>الجامعة *</label><select name="university" required><option value="">اختر الجامعة</option><option>جامعة بيرزيت</option><option>جامعة النجاح الوطنية</option><option>جامعة القدس</option><option>جامعة الخليل</option><option>جامعة بوليتكنك فلسطين</option><option>الجامعة العربية الأمريكية - جنين</option><option>الجامعة العربية الأمريكية - رام الله</option><option>جامعة بيت لحم</option><option>جامعة فلسطين الأهلية</option><option>جامعة فلسطين التقنية - خضوري</option><option>جامعة القدس المفتوحة</option><option>الكلية العصرية الجامعية</option><option>جامعة أخرى</option></select>
<label>الصورة الشخصية *</label><input name="photo" type="file" accept="image/*" required><p class="note">سيتم تصغير الصورة تلقائياً لتناسب النسخة المجانية.</p>
<label>البريد الإلكتروني *</label><input name="email" type="email" autocomplete="email" required>
<label>كلمة المرور *</label><input name="password" type="password" autocomplete="new-password" minlength="8" required>
<button id="registerBtn" class="primary" type="submit">إرسال طلب التسجيل</button><p id="registerMessage" class="error" role="alert"></p></form></div><button class="back" onclick="show('home')">رجوع</button></section>
<section id="login" class="hide"><div class="box"><h1>تسجيل الدخول</h1><form id="loginForm"><label>البريد الإلكتروني</label><input name="email" type="email" required autocomplete="email"><label>كلمة المرور</label><input name="password" type="password" required autocomplete="current-password"><button id="loginBtn" class="primary" type="submit">دخول</button><p id="loginMessage" class="error" role="alert"></p></form></div><button class="back" onclick="show('home')">رجوع</button></section>
<section id="done" class="hide"><div class="box" style="text-align:center"><h1>أهلاً بك في ANA JAWWAL!</h1><p>تم استلام طلبك، وهو بانتظار موافقة مسؤول البرنامج.</p><div class="status">حالة الطلب: Pending - بانتظار الموافقة</div></div><button class="back" onclick="show('home')">الرئيسية</button></section>
<section id="dashboard" class="hide"><div class="box"><h1>لوحة الطالب</h1><p id="welcome"></p><p>تم تفعيل عضويتك في برنامج ANA JAWWAL.</p><button id="logoutBtn" class="primary">تسجيل الخروج</button></div></section>
</main><script>function show(id){document.querySelectorAll('main section').forEach(s=>s.classList.add('hide'));document.getElementById(id).classList.remove('hide')}</script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
import {getFirestore,doc,setDoc,getDoc} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyCmQWidQXaAm7CbdBUy4heOVREfD0p1oNU',authDomain:'anajawwal.firebaseapp.com',projectId:'anajawwal',storageBucket:'anajawwal.firebasestorage.app',messagingSenderId:'226105383417',appId:'1:226105383417:web:9d13f7a2c4b5b4a1744528',measurementId:'G-ZQXEW378W1'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const registerForm=document.getElementById('registerForm'),loginForm=document.getElementById('loginForm');
function message(id,value){document.getElementById(id).textContent=value}
function friendlyError(e){const c=e.code||'';if(c==='auth/email-already-in-use')return 'البريد الإلكتروني مسجل مسبقاً.';if(c==='auth/invalid-email')return 'البريد الإلكتروني غير صحيح.';if(c==='auth/weak-password')return 'كلمة المرور ضعيفة.';if(c==='auth/invalid-credential')return 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';if(c==='permission-denied')return 'قواعد حماية Firestore لا تسمح بهذه العملية.';return e.message||'حدث خطأ غير معروف.'}
async function smallPhoto(file){if(!file||!file.type.startsWith('image/'))throw Error('اختر صورة شخصية صحيحة.');if(file.size>12*1024*1024)throw Error('الصورة كبيرة جداً. اختر صورة أصغر من 12 ميغابايت.');const img=await createImageBitmap(file);const c=document.createElement('canvas');const scale=Math.min(1,420/Math.max(img.width,img.height));c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);img.close();const data=c.toDataURL('image/jpeg',.65);if(data.length>250000)throw Error('الصورة كبيرة بعد التصغير، اختر صورة أخرى.');return data}
registerForm.addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('registerBtn');btn.disabled=true;message('registerMessage','جاري إرسال الطلب...');const data=new FormData(registerForm);let credential=null;try{const photoURL=await smallPhoto(data.get('photo'));const email=String(data.get('email')).trim(),password=String(data.get('password'));credential=await createUserWithEmailAndPassword(auth,email,password);await setDoc(doc(db,'students',credential.user.uid),{fullName:String(data.get('fullName')).trim(),phone:String(data.get('phone')).trim(),nationalId:String(data.get('nationalId')).trim(),university:String(data.get('university')),photoURL,status:'pending'});await signOut(auth);registerForm.reset();message('registerMessage','');show('done')}catch(error){message('registerMessage',friendlyError(error)+(credential?'
تم إنشاء حساب الدخول، لكن حفظ الطلب لم يكتمل. لا تحاول التسجيل مرة ثانية بنفس البريد حتى يتم إصلاح الصلاحيات.':''))}finally{btn.disabled=false}});
loginForm.addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('loginBtn');btn.disabled=true;message('loginMessage','');const data=new FormData(loginForm);try{const credential=await signInWithEmailAndPassword(auth,String(data.get('email')).trim(),String(data.get('password')));const snapshot=await getDoc(doc(db,'students',credential.user.uid));if(!snapshot.exists()){await signOut(auth);throw Error('لا يوجد طلب طالب مرتبط بهذا الحساب.')}const student=snapshot.data();if(student.status!=='approved'){await signOut(auth);message('loginMessage',student.status==='pending'?'طلبك بانتظار موافقة مسؤول البرنامج.':'حسابك غير مفعّل.');return}document.getElementById('welcome').textContent='أهلاً '+student.fullName;loginForm.reset();show('dashboard')}catch(error){message('loginMessage',friendlyError(error))}finally{btn.disabled=false}});
document.getElementById('logoutBtn').addEventListener('click',async()=>{await signOut(auth);show('home')});
</script></body></html>
